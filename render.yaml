services:
  - type: web
    name: shesync-web
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python reminder_worker.py & exec gunicorn --workers 1 --bind 0.0.0.0:$PORT backend_api:app
    healthCheckPath: /api/health
    envVars:
      - key: COOKIE_SECURE
        value: "true"
      - key: PUBLIC_BASE_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: EMAIL_PROVIDER
        sync: false
      - key: GMAIL_USERNAME
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: SHESYNC_DB
        value: /var/data/shesync.sqlite3
    disk:
      name: shesync-data
      mountPath: /var/data
      sizeGB: 1
